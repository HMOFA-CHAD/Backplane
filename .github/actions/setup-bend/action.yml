name: Setup Bend
description: Install a pinned Bend release, verified by sha256.
inputs:
  version:
    description: Bend version
    default: "2.0.36"
runs:
  using: composite
  steps:
    - shell: bash
      run: |
        set -euo pipefail
        case "${RUNNER_OS}-${RUNNER_ARCH}" in
          Linux-X64)   plat=linux-x64;    sum=02089dc0eed0fd5fd6d73c74cc9cffcb2c6638dd3b02ae83f7b8cc57fbe381ba ;;
          Linux-ARM64) plat=linux-arm64;  sum=a14a311e39bad45f9669d4eab39d156b578c945f13a2b7bae20d9c23567a4664 ;;
          macOS-ARM64) plat=darwin-arm64; sum=2876687ceb0aba836abc98b3f62c8fc9fb612d124ae2af6814d5ec937760878d ;;
          macOS-X64)   plat=darwin-x64;   sum=925bb306c60260e1cdde56c2b8e4ba0e1eb4cbc88a76372cc0bb389a172dccdf ;;
          *) echo "unsupported runner ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
        esac
        [ "${{ inputs.version }}" = "2.0.36" ] || { echo "update the pinned sha256 sums for ${{ inputs.version }}"; exit 1; }
        name="bend-${{ inputs.version }}-${plat}.tar.gz"
        tmp=$(mktemp -d)
        curl --proto '=https' --tlsv1.2 -fsSL -o "$tmp/$name" \
          "https://github.com/bendlang/bend/releases/download/v${{ inputs.version }}/$name"
        echo "$sum  $tmp/$name" | shasum -a 256 -c -
        tar -xzf "$tmp/$name" -C "$tmp"
        mkdir -p "$HOME/.bend/bin"
        mv "$tmp/bend/bend2" "$tmp/bend/guide" "$HOME/.bend/"
        mv "$tmp/bend/bin/bend" "$HOME/.bend/bin/bend"
        echo "$HOME/.bend/bin" >> "$GITHUB_PATH"
        echo "BEND_NO_TELEMETRY=1" >> "$GITHUB_ENV"
