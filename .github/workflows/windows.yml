name: Windows Bend service producer (artifact only)

# Heavy portable C emission runs with the Windows owner on an admitted >=20GiB
# Boat/native host, never on this stock CI runner. Root then selects native or
# package against exact frozen emitted artifacts. Native uses one C compile lane.
# Native saves compiler output; root selects truthful unsigned-portable policy
# or existing approved signing. No certificate purchase or signing is implied.
on:
  workflow_dispatch:
    inputs:
      ref:
        type: string
        required: true
        description: Full frozen source commit containing the accepted producer
      version:
        type: string
        default: v0.12.0
        required: true
      operation:
        type: choice
        options: [native, package]
        default: native
      request_run_id:
        type: string
        default: ''
        description: Completed root-selected input-artifact run; native/package only
      request_artifact_id:
        type: string
        default: ''
      request_sha256:
        type: string
        default: ''
        description: Reviewed windows-service-request.json digest
      telemetry_url:
        type: string
        default: https://backplane.works/api/v1/events
  workflow_call:
    inputs:
      ref:
        required: true
        type: string
      version:
        required: true
        type: string
      operation:
        type: string
        default: native
      request_run_id:
        type: string
        default: ''
      request_artifact_id:
        type: string
        default: ''
      request_sha256:
        type: string
        default: ''
      telemetry_url:
        type: string
        default: https://backplane.works/api/v1/events

permissions:
  contents: read
  actions: read

env:
  BACKPLANE_FROZEN_COMMIT: ${{ inputs.ref }}
  BACKPLANE_VERSION: ${{ inputs.version }}
  BACKPLANE_VERSION_STAMP: '0.12.0'
  BACKPLANE_TELEMETRY_CHANNEL: release

jobs:
  identity:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Require actual frozen source and implemented service entrypoint
        env:
          WORKFLOW_COMMIT: ${{ github.sha }}
          OPERATION: ${{ inputs.operation }}
        run: |
          python3 - <<'CHECK'
          import os, runpy, subprocess
          from pathlib import Path
          e = os.environ
          runpy.run_path('scripts/release-assets.py')['identity'](e['BACKPLANE_FROZEN_COMMIT'], e['BACKPLANE_VERSION'])
          if e['BACKPLANE_VERSION'] != 'v0.12.0' or e['OPERATION'] not in ('native','package'):
              raise SystemExit('explicit 0.12.0 service operation required')
          if e['WORKFLOW_COMMIT'] != e['BACKPLANE_FROZEN_COMMIT'] or subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() != e['BACKPLANE_FROZEN_COMMIT']:
              raise SystemExit('workflow and checkout must match frozen source')
          if not Path('scripts/windows-service.py').is_file():
              raise SystemExit('Windows owner service producer is not integrated')
          CHECK

  native-or-package:
    needs: [identity]
    runs-on: windows-2022
    timeout-minutes: 75
    env:
      BACKPLANE_CYGWIN_ROOT: ${{ github.workspace }}\..\backplane-cygwin
      BACKPLANE_JOBS: '1'
      BP_OPERATION: ${{ inputs.operation }}
      BP_REQUEST_SHA256: ${{ inputs.request_sha256 }}
    steps:
      - name: Keep checked-in shell sources as LF
        shell: pwsh
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}
          persist-credentials: false
      - name: Check root-selected input artifact provenance
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          BP_REQUEST_RUN: ${{ inputs.request_run_id }}
          BP_REQUEST_ARTIFACT: ${{ inputs.request_artifact_id }}
        run: |
          if ($env:BP_REQUEST_RUN -notmatch '^[1-9][0-9]*$' -or $env:BP_REQUEST_ARTIFACT -notmatch '^[1-9][0-9]*$' -or $env:BP_REQUEST_SHA256 -cnotmatch '^[0-9a-f]{64}$') { throw 'Reviewed request run/artifact/digest required' }
          $run = gh api "repos/$env:GITHUB_REPOSITORY/actions/runs/$env:BP_REQUEST_RUN" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $run.head_sha -cne $env:BACKPLANE_FROZEN_COMMIT -or $run.status -ne 'completed' -or $run.conclusion -ne 'success') { throw 'Input run source/result mismatch' }
          $artifact = gh api "repos/$env:GITHUB_REPOSITORY/actions/artifacts/$env:BP_REQUEST_ARTIFACT" | ConvertFrom-Json
          if ($LASTEXITCODE -ne 0 -or $artifact.expired -or [string]$artifact.workflow_run.id -ne $env:BP_REQUEST_RUN) { throw 'Input artifact provenance mismatch' }
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ${{ github.repository }}
          run-id: ${{ inputs.request_run_id }}
          artifact-ids: ${{ inputs.request_artifact_id }}
          path: build/windows-request
      - name: Bind request and set up Windows owner's native compiler environment
        shell: pwsh
        run: |
          $request = 'build/windows-request/windows-service-request.json'
          if ((Get-FileHash -LiteralPath $request -Algorithm SHA256).Hash.ToLowerInvariant() -cne $env:BP_REQUEST_SHA256) { throw 'Request bytes differ from reviewed digest' }
          ./scripts/setup-windows.ps1 -Root $env:BACKPLANE_CYGWIN_ROOT -BuildTools
          if ($LASTEXITCODE -ne 0) { throw 'Windows producer environment failed' }
      - name: Native configured compile only; private inputs never enter artifacts
        if: inputs.operation == 'native'
        shell: pwsh
        env:
          BACKPLANE_GOOGLE_BAKE: '1'
          BACKPLANE_GOOGLE_CLIENT_ID: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_ID }}
          BACKPLANE_GOOGLE_CLIENT_SECRET: ${{ secrets.BACKPLANE_GOOGLE_CLIENT_SECRET }}
          BACKPLANE_TELEMETRY_BAKE: '1'
          BACKPLANE_TELEMETRY_URL: ${{ inputs.telemetry_url }}
          BACKPLANE_TELEMETRY_KID: ${{ secrets.BACKPLANE_TELEMETRY_KID }}
          BACKPLANE_TELEMETRY_KEY: ${{ secrets.BACKPLANE_TELEMETRY_KEY }}
        run: |
          $bin = Join-Path $env:BACKPLANE_CYGWIN_ROOT 'bin'
          $env:PATH = $bin + ';' + $env:PATH
          $workspace = & (Join-Path $bin 'cygpath.exe') -u $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Cygwin path mapping failed' }
          & (Join-Path $bin 'bash.exe') --login -c 'cd "$1" && python3 scripts/release-assets.py check-bake --source "$BACKPLANE_FROZEN_COMMIT" --tag "$BACKPLANE_VERSION" && python3 scripts/windows-release-request.py native build/windows-request/windows-service-request.json' -- $workspace
          exit $LASTEXITCODE
      - name: Package according to root portable/signing and resident lifecycle policy
        if: inputs.operation == 'package'
        shell: pwsh
        run: |
          $bin = Join-Path $env:BACKPLANE_CYGWIN_ROOT 'bin'
          $env:PATH = $bin + ';' + $env:PATH
          $workspace = & (Join-Path $bin 'cygpath.exe') -u $env:GITHUB_WORKSPACE
          if ($LASTEXITCODE -ne 0) { throw 'Cygwin path mapping failed' }
          & (Join-Path $bin 'bash.exe') --login -c 'cd "$1" && python3 scripts/windows-release-request.py package build/windows-request/windows-service-request.json' -- $workspace
          exit $LASTEXITCODE
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'native'
        with:
          name: windows-service-native-for-signing
          path: |
            build/windows-service-native/backplane-serve.exe
            build/windows-service-native/unsigned-service.exe
            build/windows-service-native/COMPILE.json
            build/windows-service-native/inputs/**
          if-no-files-found: error
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: inputs.operation == 'package'
        with:
          name: windows-service-resources
          path: build/windows-service-resources/*
          if-no-files-found: error
          retention-days: 7
